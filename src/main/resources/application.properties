spring.application.name=kabengosafaris
# -----------------------------------------
# Database Configuration
# -----------------------------------------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:springboot_itineraryledger_kabengosafaris}?zeroDateTimeBehavior=convertToNull&connectTimeout=5000

# How long anything waits on the database before giving up.
#
# Both exist because of the readiness probe: with the defaults, stopping MySQL made the probe HANG
# for 30 seconds instead of answering DOWN, so a deploy gate would time out rather than report, and
# a load balancer would keep sending traffic to an instance that cannot serve. A request that cannot
# get a connection in five seconds is not going to have a good day anyway.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.username=${DB_USERNAME:kabengosafaris}
spring.datasource.password=${DB_PASSWORD:}

# -----------------------------------------
# JPA / Hibernate Configuration
# -----------------------------------------

# Allows Spring JPA to generate DDL (tables, constraints) based on your entities
# Off: Flyway owns the schema now, and this is the other switch that lets Hibernate write to it.
spring.jpa.generate-ddl=false

# Tells Hibernate to automatically update the database schema to match entities
# (useful in dev, not recommended for production)
# spring.jpa.hibernate.ddl.auto=update

# Same as above (preferred property name); keeps schema updated automatically
# Hibernate no longer changes the schema — it checks it.
#
# `update` guesses: it adds what it can, silently skips what it cannot, and invents a default when
# asked for a NOT NULL column on a populated table. Every instance therefore drifts its own way,
# and the drift is invisible until a query hits the column that never arrived. `validate` means an
# instance whose schema does not match this build refuses to start, which the deploy gate turns
# into an automatic rollback instead of a mystery.
spring.jpa.hibernate.ddl-auto=validate

# Set the Hibernate SQL dialect so it generates SQL optimized for MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Format generated SQL queries for readable logging output
spring.jpa.properties.hibernate.format-sql=false


# -----------------------------------------
# Server / Error Handling
# -----------------------------------------

# Include error messages in API error responses (helpful for debugging)
server.error.include-message=never

# -----------------------------------------
# SQL Initialization
# -----------------------------------------

# Disable running schema.sql or data.sql files at startup
spring.sql.init.mode=never

# -----------------------------------------
# Server Port
# -----------------------------------------

# Change the default server port from 8080 to 4450
server.port=4450

# =============================================================================
# HEALTH, READINESS AND BUILD INFO
# =============================================================================
# Two questions, two answers:
#
#   liveness  — is the process alive? (systemd's question; a database blip must NOT answer no,
#               or a restart loop is one outage away)
#   readiness — can it serve? database reachable, schema the one this jar expects, data directory
#               writable, and every ApplicationRunner finished — which is what seeds the permission
#               catalogue, the roles, the email events and the templates. This is the deploy gate.
#
# Actuator listens on its own port bound to LOCALHOST, so the detail (component names, versions,
# paths, free space) is readable by the box and the deploy script and by nobody else. The only
# health the internet can reach is the `public` group at /api/public/health: a bare UP or DOWN.
management.server.port=4451
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db,schema,storage

# What an uptime monitor may know: the answer, not the anatomy. One segment only — actuator
# rejects a nested additional-path, which is why this is /healthz and not /api/public/health.
#
# The SAME components as readiness, deliberately: a terse probe that reaches a different conclusion
# from the real one is worse than no probe. Tested by making the data directory unwritable — this
# said UP while uploads were broken, until the include list matched.
management.endpoint.health.group.public.include=readinessState,db,schema,storage
management.endpoint.health.group.public.show-details=never
management.endpoint.health.group.public.show-components=never
management.endpoint.health.group.public.additional-path=server:/healthz

# The SMTP probe opens a connection on every call — too slow and too flaky to gate a deploy on,
# and a mail server that is down is not a reason to take the panel out of service.
management.health.mail.enabled=false
# There is no LDAP in this system; the indicator auto-configures off a transitive dependency and
# reported the whole app DOWN because nothing answers on localhost:389.
management.health.ldap.enabled=false
management.health.diskspace.threshold=500MB

# Version and build time, so a running instance can say which build it is (localhost only).
management.info.env.enabled=true
management.info.build.enabled=true
management.info.git.enabled=true
info.app.company=${app.company.name:}

# One storage root per instance. It was ./data relative to the working directory, so two services
# started from one directory shared every uploaded file between two companies.
# Versioned schema changes, in charge from here.
#
# An existing database is BASELINED at version 1 — Flyway records it and skips V1, so no live
# schema is touched by switching this on. An empty one (a new company) runs V1 and gets the whole
# schema. Every change after this is its own V<n>__ file, applied in order, identically everywhere.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema as ddl-auto left it

app.data.dir=${APP_DATA_DIR:./data}
app.data.min-free-bytes=${APP_DATA_MIN_FREE_BYTES:104857600}


# Trust reverse proxy headers (X-Forwarded-For, X-Real-IP, X-Forwarded-Proto)
server.forward-headers-strategy=native

# -----------------------------------------
# Dev Tools
# -----------------------------------------

# Enable automatic restart when Java files change (for faster development)
spring.devtools.restart.enabled=false

# -----------------------------------------
# Logging Configuration
# -----------------------------------------

# Set logging levels for different packages
logging.level.root=WARN
logging.level.com.itineraryledger.kabengosafaris=INFO
logging.level.org.springframework.security=WARN

# Application log file configuration
logging.file.name=logs/application.log

# Log file rotation settings
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.file-name-pattern=logs/application-%d{yyyy-MM-dd}.%i.log

# # Log pattern for file output
# logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# # Log pattern for console output
# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %clr([%thread]){faint} %clr(%-5level){highlight} %clr(%logger{36}){cyan} - %msg%n

# -----------------------------------------
# Audit Logging Configuration
# -----------------------------------------
# NOTE: These are FALLBACK/DEFAULT values. The actual configuration is stored in the
# 'audit_log_settings' database table and can be dynamically modified at runtime via
# AuditLogSettingServices without requiring an application restart.
#
# The AuditLogSettingInitializer component (runs at application startup) loads these
# default values into the database if they don't already exist.

# Enable async processing for audit logs to avoid blocking requests
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100

# Audit log retention (in days) - logs older than this will be cleaned up
audit.log.retention.days=90

# Enable or disable audit logging globally
audit.log.enabled=true

# Whether to capture IP address in audit logs
audit.log.capture.ip.address=true

# Whether to capture User-Agent in audit logs
audit.log.capture.user.agent=true

# Whether to capture old values before updates in audit logs
audit.log.capture.old.values=true

# Whether to capture new values after updates in audit logs
audit.log.capture.new.values=true

# Comma-separated list of fields to exclude from audit logs (case-insensitive)
audit.log.excluded.fields=password,token,secret,apikey,creditcard

# Maximum length of captured old/new values (to prevent huge JSON strings)
audit.log.max.value.length=2048


# -----------------------------------------
# Security Settings Configuration
# -----------------------------------------
# NOTE: These are FALLBACK/DEFAULT values used if database settings are not available.
# The actual configuration is stored in the 'security_settings' database table and can be
# dynamically modified at runtime via SecuritySettingsService.
#
# The SecuritySettingsInitializer component (runs at application startup with highest priority)
# loads these values into the database if they don't already exist.

# JWT Token Settings
security.jwt.expiration.time.minutes=180
security.mfa.jwt.expiration.time.seconds=180
security.registration.jwt.expiration.time.minutes=60
security.password-reset.jwt.expiration.time.minutes=30
security.jwt.refresh.expiration.time.minutes=10080

# ID Obfuscation Settings
security.idObfuscator.obfuscated.length=70
security.idObfuscator.salt.length=21
# Unset means "generate one on every boot", which changes every obfuscated id at every restart and
# breaks saved links. Set it per company — provisioning writes one into the environment file.
security.idObfuscator.salt=${SECURITY_IDOBFUSCATOR_SALT:}

# Password Policy Settings
security.password.min.length=8
security.password.max.length=128
security.password.require.uppercase=true
security.password.require.lowercase=true
security.password.require.numbers=true
security.password.require.special.characters=true
security.password.expiration.days=90
security.password.history.count=5

# Account Lockout Settings
security.account-lockout.max-failed-attempts=5
security.account-lockout.lockout-duration-minutes=30
security.account-lockout.enabled=true
security.account-lockout.counter-reset-hours=24

# Login Rate Limiting Settings (Token Bucket Algorithm)
security.login-rate-limit.max-capacity=5
security.login-rate-limit.refill-rate=5
security.login-rate-limit.refill-duration-minutes=1
security.login-rate-limit.enabled=true

# -----------------------------------------
# Session Management
# -----------------------------------------
# Disable Spring Session JDBC
spring.session.store-type=none
# OR exclude the auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

# -----------------------------------------
# Email Configuration & Encryption
# -----------------------------------------
# Encryption key for email configuration secrets
# Format: Base64-encoded AES-256 key (32 bytes / 256 bits)
# Generate a key: You can use an online base64 encoder or set EMAIL_ENCRYPTION_KEY environment variable
# For production, ALWAYS set the EMAIL_ENCRYPTION_KEY environment variable instead of hardcoding here
# email.encryption.key=YOUR_BASE64_ENCODED_KEY_HERE

# -----------------------------------------
# Email Signature Configuration
# -----------------------------------------
# Directory path for storing email signature files
# Files will be stored as: {signature.storage.path}/{accountName}_{signatureName}_{timestamp}.html
email.signature.storage.path=${app.data.dir}/email-signatures/

# Maximum file size for signature uploads (in bytes) - 1MB
email.signature.max.file.size=1048576

# Allowed file extensions for signature files (comma-separated)
email.signature.allowed.extensions=html,txt

# -----------------------------------------
# Email Template Configuration
# ------------------------------------email.signature.max.file.size-----
# Directory path for storing email event template files
# Files will be stored as: {template.storage.path}/{eventName}_{templateName}_{timestamp}.html
email.template.storage.path=${app.data.dir}/email-templates/

# Maximum file size for template uploads (in bytes) - 2MB
email.template.max.file.size=2097152

# -----------------------------------------
# Application URL Configuration
# -----------------------------------------
# Base URL for the application (used for generating activation links, password reset links, etc.)
# For development: http://localhost:4450
# For production: https://yourdomain.com
# app.base.url=http://localhost:4450
app.base.url=${APP_BASE_URL:https://api.kabengosafaris.ryhqtech.com}

# Management Base URL (for panel links in emails)
# For development: http://localhost:3000
# For production: https://yourdomain.com
app.management.base.url=${APP_MANAGEMENT_URL:https://management.kabengosafaris.com}

# -----------------------------------------
# PDF Template Configuration
# -----------------------------------------
# Directory path for storing PDF template files
# Files will be stored as: {template.storage.path}/{documentName}_{templateName}_{timestamp}.html
pdf.template.storage.path=${app.data.dir}/pdf-templates/

# Maximum file size for template uploads (in bytes) - 5MB
pdf.template.max.file.size=5242880

# -----------------------------------------
# Word (.docx) Generation Engine
# -----------------------------------------
# Engine used by WordGenerator to convert rendered HTML to .docx bytes.
#   docx4j      (default) — in-JVM via docx4j XHTMLImporter. No host deps. Good
#                           body fidelity; drops @page rules, running footers,
#                           counter(page), and SVG.
#   libreoffice            — headless LibreOffice via JODConverter. Higher
#                           visual fidelity. Requires LibreOffice installed on
#                           the host AND jodconverter.local.enabled=true.
docx.engine=docx4j

# -----------------------------------------
# JODConverter / LibreOffice (only used when docx.engine=libreoffice)
# -----------------------------------------
# Off by default so installs without LibreOffice aren't affected. Flip to true
# once LibreOffice is installed (e.g. apt install libreoffice-core libreoffice-writer).
jodconverter.local.enabled=false

# Explicit path to the LibreOffice install. Leave commented on Debian/Ubuntu so
# JODConverter autodiscovers /usr/lib/libreoffice. Override for non-standard installs.
# jodconverter.local.office-home=/usr/lib/libreoffice

# Port(s) for the soffice pool. Multiple ports = multiple parallel office instances.
jodconverter.local.port-numbers=2002

# Recycle each soffice process after this many conversions (defends against memory leaks).
jodconverter.local.max-tasks-per-process=100

# Per-conversion timeout (ms). Raise for very large documents.
jodconverter.local.task-execution-timeout=120000

# How long a task may wait in the queue before failing (ms).
jodconverter.local.task-queue-timeout=30000

# -----------------------------------------
# Translation / LibreTranslate Configuration
# -----------------------------------------
# NOTE: These are FALLBACK/DEFAULT values. The actual configuration is stored in the
# 'translation_settings' database table and can be dynamically modified at runtime via
# TranslationSettingServices without requiring an application restart.
#
# The TranslationSettingsInitializer component (runs at application startup after PdfDocumentInitializer)
# loads these values into the database if they don't already exist.

# CONNECTION Settings
# Enable or disable LibreTranslate integration (set to true when LibreTranslate is running)
translation.libretranslate.enabled=false

# Base URL for LibreTranslate API
# For Docker: http://localhost:5000
# For cloud/hosted: https://libretranslate.com (requires API key)
translation.libretranslate.base.url=http://localhost:5000

# HTTP request timeout in seconds for LibreTranslate API calls
translation.libretranslate.timeout.seconds=30

# API key for authenticated LibreTranslate instances (leave empty for open/self-hosted instances)
translation.libretranslate.api.key=

# LANGUAGE Settings
# Default source language code (ISO 639-1)
translation.default.source.language=en

# Default target language when no specific language is requested
translation.default.target.language=fr

# Comma-separated list of supported language codes
# Common codes: en (English), fr (French), de (German), es (Spanish), it (Italian),
#               pt (Portuguese), sw (Swahili), ar (Arabic), zh (Chinese), ja (Japanese)
translation.supported.languages=en,fr,de,es,it,pt,sw

# CACHING Settings
# Enable or disable translation caching to reduce API calls
translation.cache.enabled=true

# Time-to-live for cached translations in hours (168 = 7 days)
translation.cache.ttl.hours=168

# LIMITS Settings
# Maximum number of characters allowed per translation request
translation.max.characters=10000

# Size of text chunks when splitting large texts for translation
translation.chunk.size=5000

