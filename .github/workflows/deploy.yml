name: Build & Deploy to every company

# One merge, N companies. The jar is built and tested ONCE, then released to the canary first; only
# if that installation comes back healthy do the others get it. A bad build therefore costs one
# company a rollback instead of all of them.
#
# Adding a company is a pull request against companies.json plus a GitHub Environment named after its
# id, holding DROPLET_HOST and DROPLET_SSH_KEY. Nothing here needs editing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Two releases racing means two restarts fighting over one symlink, per company.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      canary: ${{ steps.plan.outputs.canary }}
      rest: ${{ steps.plan.outputs.rest }}
      artifact: release-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Tests run before anything is built for anybody. The one test needing a real MySQL — the
      # @SpringBootTest context load — is explicitly @Disabled with its reason, which is what let
      # every other test start running instead of the whole suite being skipped.
      - name: Test
        run: ./mvnw -q clean test

      - name: Build the release
        # -Dgit.sha stamps the commit into the jar, so /api/public/version can name it later.
        run: ./mvnw -q package -DskipTests -Dgit.sha=${{ github.sha }}

      - name: Hand it over
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: target/kabengosafaris-*.jar
          retention-days: 5

      - name: Read the company list
        id: plan
        # The canary and the rest come out of companies.json, so the deploy order is reviewable in a
        # pull request rather than buried in this file.
        run: |
          set -e
          canary=$(jq -c '[.companies[] | select(.canary == true)]' companies.json)
          rest=$(jq -c '[.companies[] | select(.canary != true)]' companies.json)
          echo "canary=$canary" >> "$GITHUB_OUTPUT"
          echo "rest=$rest" >> "$GITHUB_OUTPUT"
          echo "canary: $(echo "$canary" | jq -r '.[].id')"
          echo "then:   $(echo "$rest" | jq -r '.[].id' | tr '\n' ' ')"
          if [ "$(echo "$canary" | jq 'length')" != "1" ]; then
            echo "::error::exactly one company must be the canary"; exit 1
          fi

  canary:
    needs: build
    strategy:
      matrix:
        company: ${{ fromJson(needs.build.outputs.canary) }}
    uses: ./.github/workflows/deploy-one.yml
    with:
      id: ${{ matrix.company.id }}
      name: ${{ matrix.company.name }}
      appDir: ${{ matrix.company.appDir }}
      service: ${{ matrix.company.service }}
      healthPort: ${{ matrix.company.healthPort }}
      apiPort: ${{ matrix.company.apiPort }}
      dumpCommand: ${{ matrix.company.dumpCommand }}
      publicHealthUrl: ${{ matrix.company.publicHealthUrl }}
      artifact: ${{ needs.build.outputs.artifact }}
    secrets: inherit

  everyone-else:
    # Gated on the canary: a release that could not come back healthy for one company does not reach
    # the next one.
    needs: [build, canary]
    strategy:
      max-parallel: 1
      # One company's failure must not cancel a release already under way elsewhere.
      fail-fast: false
      matrix:
        company: ${{ fromJson(needs.build.outputs.rest) }}
    uses: ./.github/workflows/deploy-one.yml
    with:
      id: ${{ matrix.company.id }}
      name: ${{ matrix.company.name }}
      appDir: ${{ matrix.company.appDir }}
      service: ${{ matrix.company.service }}
      healthPort: ${{ matrix.company.healthPort }}
      apiPort: ${{ matrix.company.apiPort }}
      dumpCommand: ${{ matrix.company.dumpCommand }}
      publicHealthUrl: ${{ matrix.company.publicHealthUrl }}
      artifact: ${{ needs.build.outputs.artifact }}
    secrets: inherit

  report:
    needs: [build, canary, everyone-else]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Who is running what
        # The answer to "is anybody behind?" — asked from outside, after the dust settles.
        run: |
          echo "| company | version | commit | built |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.companies[] | [.id, .publicHealthUrl] | @tsv' companies.json |
          while IFS=$'\t' read -r id url; do
            base=$(echo "$url" | sed -E 's|(https?://[^/]+).*|\1|')
            body=$(curl -fsS --max-time 20 "$base/api/public/version" 2>/dev/null || echo '{}')
            echo "| $id | $(echo "$body" | jq -r '.version // "?"') | $(echo "$body" | jq -r '.commit // "?"' | cut -c1-8) | $(echo "$body" | jq -r '.builtAt // "?"') |" >> "$GITHUB_STEP_SUMMARY"
          done
          cat "$GITHUB_STEP_SUMMARY"
