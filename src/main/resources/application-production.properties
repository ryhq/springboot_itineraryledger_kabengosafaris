# -----------------------------------------
# Website & invoice files (declared, not moved)
# -----------------------------------------
# Every path above is release-relative, so it resolves against the service's working directory
# (/opt/<company>) and NOT against ${app.data.dir} (/srv/<company>/data), which is the root
# ISOLATION.md describes and the readiness probe tests. That split is not deliberate; it is what
# these modules have always done, and Kabengo has live files in it -- a blog cover serves from
# there today. Repointing them is a file move on both droplets, not a properties edit, so the
# five below are written down where they already are. Expense documents are NOT in this list on
# purpose: that tree has never been written, so it starts in the right place.
blog.image.storage.path=./data/blog-images/
hero.image.storage.path=./data/hero-images/
testimony.image.storage.path=./data/testimony-images/
itinerary.image.storage.path=./data/itinerary-images/
invoice.document.storage.path=./data/invoice-documents/

# -----------------------------------------
# Backup Configuration
# -----------------------------------------
# NOTE: These are FALLBACK/DEFAULT values. The actual configuration is stored in the
# 'backup_settings' database table and can be dynamically modified at runtime via
# BackupSettingsServices without requiring an application restart.
#
# The BackupSettingsInitializer component (runs at application startup after FileSettingsInitializer)
# loads these values into the database if they don't already exist.

# General Backup Settings
backup.enabled=true
backup.type=FULL

# Backup Schedule Settings
backup.schedule.enabled=true
backup.schedule.cron=0 0 2 * * ?

# Itinerary Cost Recalculation Schedule (daily at 3 AM)
itinerary.cost.schedule.cron=0 0 3 * * ?

# Database Backup Settings
backup.database.enabled=true
backup.database.host=${MYSQL_HOST:localhost}
backup.database.port=3306
backup.database.name=${MYSQL_DATABASE:}
backup.database.username=${DB_USERNAME:kabengosafaris}
backup.database.include.routines=true
backup.database.include.triggers=true
backup.database.include.events=false

# File System Backup Settings
backup.files.enabled=true

# STATIC PATH (NOT in database settings - requires restart to change)
backup.files.base.path=./data/

backup.files.include.email.signatures=true
backup.files.include.email.templates=true
backup.files.include.pdf.templates=true
backup.files.include.accommodation.images=true
backup.files.include.accommodation.documents=true
backup.files.include.park.images=true
backup.files.include.park.documents=true
backup.files.include.activity.images=true
backup.files.include.activity.documents=true
backup.files.include.itinerary.documents=true
backup.files.include.quote.documents=true
backup.files.include.safari.documents=true

# Backup Storage Settings
# STATIC PATH (NOT in database settings - requires restart to change)
backup.storage.path=./backups/

backup.storage.filename.prefix=${BACKUP_FILENAME_PREFIX:backup}
backup.storage.filename.date.format=yyyyMMdd_HHmmss

# Backup Retention Settings
backup.retention.days=7
backup.retention.max.count=30
backup.retention.auto.cleanup.enabled=true

# Backup Compression Settings
backup.compression.enabled=true
backup.compression.format=zip
backup.compression.level=5

# Backup Notification Settings
backup.notification.enabled=false
backup.notification.on.success=false
backup.notification.on.failure=true
backup.notification.emails=${BACKUP_NOTIFICATION_EMAILS:${NOTIFICATION_EMAILS:}}

# -----------------------------------------
# Notification Settings Configuration
# -----------------------------------------
# NOTE: These are FALLBACK/DEFAULT values. The actual configuration is stored in the
# 'notification_settings' database table and can be dynamically modified at runtime via
# NotificationSettingServices without requiring an application restart.
#
# The NotificationSettingsInitializer component (runs at application startup)
# loads these values into the database if they don't already exist.

# Newsletter Notification Settings
notification.newsletter.enabled=true
notification.newsletter.emails=${NOTIFICATION_EMAILS:}

# Booking Inquiry Notification Settings
notification.booking_inquiry.enabled=true
notification.booking_inquiry.emails=${NOTIFICATION_EMAILS:}

# Contact Us Notification Settings
notification.contact_us.enabled=true
notification.contact_us.emails=${NOTIFICATION_EMAILS:}

# -----------------------------------------
# Email Receiving & Storage Settings
# -----------------------------------------

# Email Retention
email.retention.days=365
email.retention.auto.cleanup.enabled=true
email.retention.trash.days=30

# Email Fetch
email.fetch.auto.enabled=false
email.fetch.default.interval.minutes=5
email.fetch.max.count=50
email.fetch.interval.ms=300000

# Email Storage
email.storage.base.path=./data/emails/
email.storage.max.size=5368709120
email.eml.max.file.size=26214400
email.attachment.max.file.size=10485760
email.sent.capture.enabled=true

# -----------------------------------------
# Tomcat Access Log Configuration
# -----------------------------------------
# NOTE: Access logs are stored on disk and parsed on-demand (like ItineraryLedger)
# Optional analytics data can be stored in database for fast querying

# Enable Tomcat access logging
server.tomcat.accesslog.enabled=true

# Set Tomcat base directory (required for access logs to work)
server.tomcat.basedir=logs

# Comprehensive access log pattern
# Pattern includes: IP, port, host, timestamp, request, status, size, timing, headers, SSL info
server.tomcat.accesslog.pattern=%a %A %p %h %l %u %t "%r" %s %b %D "%{User-Agent}i" "%{Referer}i" "%{X-Forwarded-For}i" "%{Cookie}i" "%{Host}i" %S %I

# Access log directory (relative to basedir)
server.tomcat.accesslog.directory=access

# Access log file prefix
server.tomcat.accesslog.prefix=access_log

# Access log file suffix
server.tomcat.accesslog.suffix=.log

# Enable log buffering for better performance
server.tomcat.accesslog.buffered=true

# Rotate logs daily
server.tomcat.accesslog.rotate=true

# Date format in filename (e.g., access_log.2026-02-09.log)
server.tomcat.accesslog.file-date-format=.yyyy-MM-dd

# -----------------------------------------
# Enhanced Access Logging Features Configuration
# -----------------------------------------
# NOTE: Access log analysis features (security, bot detection, performance monitoring)
# use hardcoded defaults in AccessLogSettingGetterServices.
# Log file locations use server.tomcat.accesslog.* settings above.
# Log retention respects audit.log.retention.days setting for consistency.