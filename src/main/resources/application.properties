# Image Upload Configuration
# -----------------------------------------
# NOTE: These are FALLBACK/DEFAULT values. The actual configuration is stored in the
# 'image_settings' database table and can be dynamically modified at runtime via
# ImageSettingGetterServices without requiring an application restart.
#
# The ImageSettingsInitializer component (runs at application startup after TranslationSettingsInitializer)
# loads these values into the database if they don't already exist.

# Enable or disable image uploads globally
image.upload.enabled=true

# Maximum file size for image uploads (in bytes) - 5MB default
image.upload.max.file.size=5242880

# Comma-separated list of allowed image formats (file extensions)
image.upload.allowed.formats=jpg,jpeg,png,webp,gif

# -----------------------------------------
# File Upload Configuration
# -----------------------------------------
# NOTE: These are FALLBACK/DEFAULT values. The actual configuration is stored in the
# 'file_settings' database table and can be dynamically modified at runtime via
# FileSettingGetterServices without requiring an application restart.
#
# The FileSettingsInitializer component (runs at application startup after ImageSettingsInitializer)
# loads these values into the database if they don't already exist.

# GENERAL UPLOAD Settings
# Enable or disable file uploads globally
file.upload.enabled=true

# Maximum file size for uploads (Spring multipart setting)
spring.servlet.multipart.max-file-size=10MB

# Maximum request size for multipart uploads (should be larger than max-file-size for multiple files)
spring.servlet.multipart.max-request-size=50MB

# Comma-separated list of allowed file extensions
file.upload.allowed.extensions=pdf,doc,docx,xls,xlsx,csv,txt,zip,jpg,jpeg,png,gif,webp

# Comma-separated list of blocked/dangerous file extensions (security)
file.upload.blocked.extensions=exe,bat,sh,cmd,ps1,jar,msi,dll,com,scr,vbs,js

# Sanitize filenames by removing special characters
file.upload.sanitize.filename=true

# Validate that MIME type matches file extension
file.upload.validate.content.type=true

