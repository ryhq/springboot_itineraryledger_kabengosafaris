<!DOCTYPE html>
<!--
  One page for every reason a link does not work: mistyped, withdrawn, expired, never existed.

  Saying which would turn the portal into an oracle: paste a token, read the answer, learn
  whether it is real. There is also nothing useful a client could do with the distinction, and
  the one action that helps is the same in all four cases.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>This link is not available</title>
  <style>
    body {
      margin: 0; padding: 64px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #1f2421; background: #fbfcfb; line-height: 1.6;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { margin: 0 0 12px; color: #667085; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>This link is not available</h1>
    <p>
      It may have been withdrawn, or it may never have been ours. Check that you have the whole
      address from our email, including everything after the last slash.
    </p>
    <p>
      If it still does not open, reply to any message from us and we will send you a new one.
    </p>
  </div>
</body>
</html>
