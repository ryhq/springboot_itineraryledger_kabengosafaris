# -----------------------------------------
# Tomcat Access Log Configuration
# -----------------------------------------
# NOTE: Access logs are stored on disk and parsed on-demand (like ItineraryLedger)
# Optional analytics data can be stored in database for fast querying

# Enable Tomcat access logging
server.tomcat.accesslog.enabled=true

# Set Tomcat base directory (required for access logs to work)
server.tomcat.basedir=logs

# Comprehensive access log pattern
# Pattern includes: IP, port, host, timestamp, request, status, size, timing, headers, SSL info
server.tomcat.accesslog.pattern=%a %A %p %h %l %u %t "%r" %s %b %D "%{User-Agent}i" "%{Referer}i" "%{X-Forwarded-For}i" "%{Cookie}i" "%{Host}i" %S %I

# Access log directory (relative to basedir)
server.tomcat.accesslog.directory=access

# Access log file prefix
server.tomcat.accesslog.prefix=access_log

# Access log file suffix
server.tomcat.accesslog.suffix=.log

# Enable log buffering for better performance
server.tomcat.accesslog.buffered=true

# Rotate logs daily
server.tomcat.accesslog.rotate=true

# Date format in filename (e.g., access_log.2026-02-09.log)
server.tomcat.accesslog.file-date-format=.yyyy-MM-dd

# -----------------------------------------
# Enhanced Access Logging Features Configuration
# -----------------------------------------
# NOTE: Access log analysis features (security, bot detection, performance monitoring)
# use hardcoded defaults in AccessLogSettingGetterServices.
# Log file locations use server.tomcat.accesslog.* settings above.
# Log retention respects audit.log.retention.days setting for consistency.
# ---------------------------------------------------------------- the company
# Who letters to suppliers say they are from, and the accent their headings use.
# Declared rather than hard-coded so a deployment states its own identity in config;
# the availability-request letter reads both.
# ---------------------------------------------------------------- provisioning
# The first account on an EMPTY installation: created with SUPERADMIN, a generated password nobody
# sees, and an activation email. Ignored the moment any account exists, so a restart cannot mint one.
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}

# The mail account written on a FIRST boot only. Mail is sent through an account in the database, so
# without this a fresh installation cannot send the very activation email its first account needs.
app.bootstrap.smtp.host=${APP_BOOTSTRAP_SMTP_HOST:}
app.bootstrap.smtp.port=${APP_BOOTSTRAP_SMTP_PORT:587}
app.bootstrap.smtp.username=${APP_BOOTSTRAP_SMTP_USERNAME:}
app.bootstrap.smtp.password=${APP_BOOTSTRAP_SMTP_PASSWORD:}
app.bootstrap.smtp.from=${APP_BOOTSTRAP_SMTP_FROM:}

# seed/blogs.json and seed/faqs.json are ONE company's real content. Off by default so a new company
# does not publish somebody else's words; the company those rows belong to already has them.
app.seed.demo-content.enabled=${APP_SEED_DEMO_CONTENT:false}

app.company.name=Kabengo Safaris
app.brand.accent=#1c7a58
