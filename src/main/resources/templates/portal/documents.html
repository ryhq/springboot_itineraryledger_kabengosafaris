<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{portal/_layout :: layout('Documents', ~{::section})}">
<body>
<section>

  <h1>Documents</h1>
  <p class="lede">Everything we have sent you for this trip, in one place.</p>

  <div class="card" th:if="${!#lists.isEmpty(page.documents)}">
    <div class="rows">
      <div class="row" th:each="document : ${page.documents}">
        <div>
          <a th:href="'/portal/' + ${page.journeyToken} + '/documents/' + ${document.id} + '/file'"
             th:text="${document.title}" style="font-weight:600">Quotation</a>
          <div class="sub" th:if="${document.createdAt != null}"
               th:text="${#temporals.format(document.createdAt, 'd MMMM yyyy')}">21 October 2026</div>
        </div>
        <span class="pill" th:text="${document.kind}">QUOTE</span>
      </div>
    </div>
  </div>

  <div class="card" th:if="${#lists.isEmpty(page.documents)}">
    <p style="margin:0">Nothing filed yet. Anything we send you will appear here as well.</p>
  </div>

</section>
</body>
</html>
