# =============================================
# COMPANY BRAND ASSETS (Settings -> Company)
# =============================================
# The five brand files: logo light/dark, favicon light/dark, and a raster logo for email.
# Small by design - these load on every page and inside every outgoing message.
company.asset.storage.path=${app.data.dir}/company-assets/
company.asset.max-bytes=2097152

# -----------------------------------------
# Safari Lifecycle & Phase Alert Schedulers
# -----------------------------------------
# Safari lifecycle scheduler: auto-start, auto-complete, auto-close, payment gap detection
# Runs daily at 6:00 AM
safari.lifecycle.schedule.cron=0 0 6 * * ?

# Safari phase alert scheduler: readiness checks, imminent alerts, post-trip reminders
# Runs daily at 7:00 AM (after lifecycle scheduler)
safari.phase-alert.schedule.cron=0 0 7 * * ?

# Grace period (days) before auto-closing completed safaris
safari.lifecycle.auto-close.grace-days=14

# Safari payment scheduler: auto-transition PENDING_PAYMENT → FULLY_PAID when invoices settled
# Runs every hour
safari.payment.schedule.cron=0 0 * * * ?

# Quote expiry scheduler: auto-expire quotes past their validTo date
# Runs daily at 2:00 AM
quote.expiry.schedule.cron=0 0 2 * * ?

# -----------------------------------------
# Backup Configuration
# -----------------------------------------
# NOTE: These are FALLBACK/DEFAULT values. The actual configuration is stored in the
# 'backup_settings' database table and can be dynamically modified at runtime via
# BackupSettingsServices without requiring an application restart.
#
# The BackupSettingsInitializer component (runs at application startup after FileSettingsInitializer)
# loads these values into the database if they don't already exist.

# General Backup Settings
backup.enabled=true
backup.type=FULL

# Backup Schedule Settings
backup.schedule.enabled=true
backup.schedule.cron=0 0 2 * * ?

# Itinerary Cost Recalculation Schedule (daily at 3 AM)
itinerary.cost.schedule.cron=0 0 3 * * ?

# Database Backup Settings
backup.database.enabled=true
backup.database.host=${MYSQL_HOST:localhost}
backup.database.port=3306
# The same name the datasource uses, from the same variable — a backup of a different database than
# the one being served is a backup of nothing.
backup.database.name=${MYSQL_DATABASE:springboot_itineraryledger_kabengosafaris}
backup.database.username=${DB_USERNAME:kabengosafaris}
backup.database.include.routines=true
backup.database.include.triggers=true
backup.database.include.events=false

# File System Backup Settings
backup.files.enabled=true

# STATIC PATH (NOT in database settings - requires restart to change)
backup.files.base.path=${app.data.dir}/

backup.files.include.email.signatures=true
backup.files.include.email.templates=true
backup.files.include.pdf.templates=true
backup.files.include.accommodation.images=true
backup.files.include.accommodation.documents=true
backup.files.include.park.images=true
backup.files.include.park.documents=true
backup.files.include.activity.images=true
backup.files.include.activity.documents=true
backup.files.include.itinerary.documents=true
backup.files.include.quote.documents=true
backup.files.include.safari.documents=true

# Backup Storage Settings
