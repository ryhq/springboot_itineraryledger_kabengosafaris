<!DOCTYPE html>
<!--
  The shell every client page sits in.

  This is the first thing a customer sees of us that is not a PDF, so it is held to the standard
  of the website rather than of an internal tool: real type, real spacing, the company's own
  colour, and a header that looks deliberate on a phone.

  Four things it is responsible for, each of which would otherwise be forgotten on one page out
  of seven.

  NOINDEX. These pages carry somebody's trip, their prices and eventually their invoice. A search
  engine that finds one has published it, and the link in a client's email is exactly the kind of
  URL that leaks into a referrer header.

  THE BRAND FROM THE RECORD. Colours arrive as a block of custom properties built and validated
  in Java. They are NOT interpolated here: Thymeleaf's CSS inlining escapes what it writes, so
  `#1c7a58` becomes `\#1c7a58`, every property silently fails, and the page renders with no
  accent and invisible buttons. That shipped once.

  THE TIER. The navigation only offers what this caller may actually open, because a link that
  bounces them to a verification page every time is worse than no link.

  NOTHING FROM ANYWHERE ELSE. No web font, no script, no analytics, no icon CDN. The content
  policy on this chain forbids it and that is the point: a page with somebody's passport details
  on it is the last place to be loading a third party's JavaScript. The system font stack is also
  simply faster, which matters more on a phone in a lodge than any typeface does.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:fragment="layout(title, content)">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="same-origin" />
  <meta name="color-scheme" content="light" />
  <title th:text="${title} + ' · ' + ${page.companyName}">Your trip</title>

  <!-- the company's colours, already validated; see PortalViewService.brandCss -->
  <style th:utext="${page.brandCss}">:root{--accent:#1f6f4a;--accent-dark:#164c34;--accent-soft:#f1f6f3;}</style>

  <style>
    :root {
      --ink: #15201b;
      --body: #46524b;
      --muted: #7b8780;
      --line: #e4e9e6;
      --line-soft: #eef2f0;
      --bg: #f7f9f8;
      --card: #ffffff;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(21, 32, 27, .04), 0 8px 24px -12px rgba(21, 32, 27, .10);
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      color: var(--body);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }

    /* ---------------------------------------------------------------- header */

    header.masthead {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 18px 0 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand { display: flex; align-items: center; gap: 11px; }
    .brand img { height: 34px; width: auto; display: block; }
    .brand .name {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    nav.tabs {
      display: flex;
      gap: 2px;
      margin-top: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    nav.tabs::-webkit-scrollbar { display: none; }
    nav.tabs a {
      position: relative;
      white-space: nowrap;
      padding: 9px 13px 13px;
      font-size: 14.5px;
      font-weight: 500;
      text-decoration: none;
      color: var(--muted);
      border-bottom: 2px solid transparent;
    }
    nav.tabs a:hover { color: var(--ink); }
    nav.tabs a.on { color: var(--accent-dark); border-bottom-color: var(--accent); font-weight: 600; }

    /* ------------------------------------------------------------------ type */

    main { padding: 32px 0 64px; }

    h1 {
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      color: var(--ink);
      font-weight: 680;
    }
    h2 {
      font-size: 15px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 32px 0 12px;
      font-weight: 600;
    }
    h3 { font-size: 16.5px; margin: 2px 0 6px; color: var(--ink); font-weight: 620; }
    p { margin: 0 0 14px; }
    .lede { font-size: 16.5px; color: var(--muted); margin: 0 0 24px; }
    strong { color: var(--ink); font-weight: 600; }
    a { color: var(--accent-dark); }

    /* ----------------------------------------------------------------- cards */

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 22px;
      margin: 0 0 16px;
      box-shadow: var(--shadow);
    }
    .card > :last-child { margin-bottom: 0; }

    .note {
      background: var(--accent-soft);
      border: 1px solid var(--line);
      border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
      padding: 14px 16px;
      border-radius: var(--radius);
      margin: 0 0 18px;
      font-size: 15px;
      color: var(--ink);
    }
    .warn { background: #fdf7ec; border-color: #ead7b0; }

    /* --------------------------------------------------------------- figures */

    table.figures { width: 100%; border-collapse: collapse; }
    table.figures td { padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
    table.figures tr:last-child td { border-bottom: none; }
    table.figures td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      color: var(--ink);
    }
    table.figures tr.total td {
      font-weight: 680;
      font-size: 18px;
      color: var(--ink);
      padding-top: 14px;
    }

    /* ------------------------------------------------------------------ days */

    .day { position: relative; padding: 0 0 24px 26px; }
    .day:last-child { padding-bottom: 0; }
    .day::before {
      content: "";
      position: absolute;
      left: 4px; top: 7px; bottom: 0;
      width: 2px;
      background: var(--line);
    }
    .day:last-child::before { bottom: auto; height: 0; }
    .day::after {
      content: "";
      position: absolute;
      left: 0; top: 5px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }
    .day .n {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }
    .day .meta { font-size: 14.5px; color: var(--muted); margin-top: 8px; }
    .day .meta strong { color: var(--body); }

    /* ----------------------------------------------------------------- forms */

    label { display: block; font-size: 14px; font-weight: 550; color: var(--ink); margin: 0 0 6px; }

    input[type=text], input[type=email] {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      font-family: inherit;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      transition: border-color .12s ease, box-shadow .12s ease;
    }
    input[type=text]:hover, input[type=email]:hover { border-color: #cfd8d3; }
    input[type=text]:focus, input[type=email]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 111, 74, .18);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .code-input {
      letter-spacing: 0.45em;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 22px;
      text-align: center;
      padding: 14px;
    }
    .field { margin-bottom: 16px; }
    .field:last-of-type { margin-bottom: 20px; }

    .check {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 14.5px;
      font-weight: 400;
      color: var(--muted);
      cursor: pointer;
    }
    .check input { width: auto; margin-top: 4px; accent-color: var(--accent); }

    /* --------------------------------------------------------------- buttons */

    button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      background: var(--accent-dark);
      color: #fff;
      padding: 13px 22px;
      border-radius: 10px;
      font-size: 15.5px;
      font-family: inherit;
      font-weight: 600;
      text-decoration: none;
      transition: filter .12s ease, box-shadow .12s ease;
    }
    button:hover, .button:hover { filter: brightness(1.08); }
    button:active, .button:active { filter: brightness(.95); }
    button:focus-visible, .button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(31, 111, 74, .35);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    button.wide { width: 100%; }
    button.quiet, .button.quiet {
      background: #fff;
      color: var(--body);
      border-color: var(--line);
      font-weight: 550;
    }
    button.quiet:hover { background: var(--bg); filter: none; }
    button.link {
      background: none; border: 0; padding: 0;
      color: var(--muted); font-size: 13.5px; font-weight: 500;
      text-decoration: underline; text-underline-offset: 2px;
    }
    button.link:hover { color: var(--ink); filter: none; }

    /* ------------------------------------------------------------------ misc */

    ul.plain { margin: 0; padding-left: 20px; }
    ul.plain li { margin-bottom: 6px; }

    .two { display: flex; flex-wrap: wrap; gap: 24px; }
    .two > div { flex: 1 1 240px; }

    .rows { display: flex; flex-direction: column; }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 14px; flex-wrap: wrap;
      padding: 14px 0; border-bottom: 1px solid var(--line-soft);
    }
    .row:first-child { padding-top: 0; }
    .row:last-child { padding-bottom: 0; border-bottom: none; }
    .row .sub { font-size: 13.5px; color: var(--muted); }

    .pill {
      display: inline-block;
      font-size: 12px; font-weight: 600;
      padding: 2px 9px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent-dark);
    }

    footer {
      border-top: 1px solid var(--line);
      background: var(--card);
      padding: 24px 0 48px;
      font-size: 13.5px;
      color: var(--muted);
    }
    footer a { color: var(--muted); }
    .footer-links { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-top: 6px; }

    @media (max-width: 560px) {
      h1 { font-size: 23px; }
      main { padding: 24px 0 48px; }
      .card { padding: 16px; border-radius: 12px; }
      .wrap { padding: 0 16px; }
    }
  </style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="brand">
      <img th:if="${page.logoUrl != null}" th:src="${page.logoUrl}" alt="" />
      <span class="name" th:text="${page.companyName}">Company</span>
    </div>

    <nav class="tabs" th:with="base='/portal/' + ${page.journeyToken}">
      <a th:href="${base}" th:classappend="${title == 'Your trip'} ? 'on'">Your trip</a>
      <!--
        Only what they can open. These need a code, and before it is given they are not shown at
        all: a client clicking "Invoice" and landing on a verification form four times learns to
        distrust the whole page.
      -->
      <a th:if="${page.verified and page.quote != null}" th:href="${base} + '/quote'"
         th:classappend="${title == 'Your quotation'} ? 'on'">Quotation</a>
      <a th:if="${page.verified and page.invoice != null}" th:href="${base} + '/invoice'"
         th:classappend="${title == 'Your invoice'} ? 'on'">Invoice</a>
      <a th:if="${page.verified}" th:href="${base} + '/documents'"
         th:classappend="${title == 'Documents'} ? 'on'">Documents</a>
      <a th:if="${page.verified}" th:href="${base} + '/devices'"
         th:classappend="${title == 'Your devices'} ? 'on'">Devices</a>
      <a th:unless="${page.verified}" th:href="${base} + '/verify'"
         th:classappend="${title == 'See your quotation'} ? 'on'">See your quotation</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div th:replace="${content}">page content</div>
  </div>
</main>

<footer>
  <div class="wrap" th:with="base='/portal/' + ${page.journeyToken}">
    <strong th:text="${page.companyName}" style="color: var(--ink)">Company</strong>
    <div class="footer-links">
      <a th:href="${base} + '/privacy'">What we collect, and for how long</a>
      <!-- a form, not a link: signing out changes something, and a link that changes something
           is a link a preview bot can press -->
      <form th:if="${page.verified}" th:action="@{/api/portal/access/sign-out}" method="post">
        <input type="hidden" name="token" th:value="${page.journeyToken}" />
        <button type="submit" class="link">Sign out of this browser</button>
      </form>
    </div>
  </div>
</footer>

</body>
</html>
